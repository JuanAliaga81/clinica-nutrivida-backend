spring:
  application:
    name: blog-service

  datasource:
    url: jdbc:mysql://localhost:3306/nutrivida_blog
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8083

nutrivida:
  uploads:
    blogs-dir: uploads/blogs

