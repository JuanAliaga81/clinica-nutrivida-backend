spring:
  application:
    name: contacto-service

  datasource:
    url: jdbc:mysql://localhost:3306/nutrivida_contacto
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8084
