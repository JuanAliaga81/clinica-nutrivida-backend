spring.application.name=nutrivida-gateway
server.port=8080

spring.cloud.gateway.server.webmvc.routes[0].id=usuarios-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/personas/**,/api/usuarios/**,/api/usuarios-personas/**

spring.cloud.gateway.server.webmvc.routes[1].id=servicios-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/servicios/**

spring.cloud.gateway.server.webmvc.routes[2].id=blog-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/blogs/**,/uploads/blogs/**

spring.cloud.gateway.server.webmvc.routes[3].id=contacto-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/contactos/**

spring.cloud.gateway.server.webmvc.routes[4].id=cita-service
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/citas/**



nutrivida.jwt.secret=${NUTRIVIDA_JWT_SECRET:NutriVidaLocal2026ClaveJWT_123456789}