spring:
  application:
    name: usuarios-service

  datasource:
    url: jdbc:mysql://localhost:3306/nutrivida_usuarios
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migracion

nutrivida:
  jwt:
    secret: ${NUTRIVIDA_JWT_SECRET:NutriVidaLocal2026ClaveJWT_123456789}

server:
  port: 8081


